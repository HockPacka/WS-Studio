name: Build WildStar Model Studio (Windows EXE)
on:
  workflow_dispatch:
  push:
    branches: [main, "feature/**"]
    paths:
      - 'desktop.py'
      - 'readers.py'
      - 'native_m3.py'
      - 'native/**'
      - 'app.js'
      - 'index.html'
      - 'tests/**'
      - 'server.py'
      - 'WildStarModelStudio.spec'
      - '.github/workflows/build-windows-exe.yml'
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt "pyinstaller>=6.10,<7"
      - run: python -m unittest discover -s tests -v
      - run: python diagnose_m3.py demo/Crystal.m3
      - run: python -m PyInstaller --noconfirm --clean WildStarModelStudio.spec
      - uses: actions/upload-artifact@v4
        with:
          name: WildStarModelStudio-Windows-x64
          path: dist/WildStarModelStudio/
          if-no-files-found: error
