[package]
name = "genesis"
version = "0.1.0"
edition = "2024"
description = "WildStar Genesis visual UI replica in Bevy"

[dependencies]
bevy = "0.20.1"
bevy_egui = "0.43.1"
image = { version = "0.25", default-features = false, features = ["png"] }
wildstar_formats = { path = "crates/wildstar_formats" }
rfd = "0.17.2"

# Optimize performance-critical parsing, decompression and texture baking
[profile.dev.package.genesis]
opt-level = 2
debug = 0
codegen-units = 16

[profile.dev.package.wildstar_formats]
opt-level = 3
debug = 0

[workspace]
members = ["crates/wildstar_formats"]
resolver = "3"
