# Genesis local iteration (Bevy 0.20.1)
#
# `bevy/dynamic_linking` currently requires bevy_dylib 0.20.1,
# which is not available on crates.io. Do NOT enable it.
#
# Keep the default `dev` profile so `cargo fast` and `cargo run`
# reuse the SAME target/debug cache instead of compiling Bevy twice.
# Compilation still runs for changed Genesis source files.
[alias]
fast = "run"
fast-check = "check"
