[package]
name = "genesis"
version = "0.1.0"
edition = "2024"
description = "WildStar Genesis visual UI replica in Bevy"

[dependencies]
bevy = "0.20.1"
bevy_egui = "0.43.1"
image = { version = "0.25", default-features = false, features = ["png"] }
wildstar_formats = { path = "crates/wildstar_formats" }

# Fast local iteration: optimize only the application crate for compile/link time.
# Cargo reuses the ordinary target/debug artifacts for both cargo run and cargo fast.
# Debug assertions remain enabled; no extra Bevy features or DLLs are required.
[profile.dev.package.genesis]
opt-level = 0
debug = 0
codegen-units = 256

[workspace]
members = ["crates/wildstar_formats"]
resolver = "3"
